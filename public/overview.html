<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Tranchi AI — Overview</title>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{
      --bg:#0f1117;--surface:#1a1d27;--surface2:#22263a;--border:#2a2d3a;
      --text:#e2e8f0;--muted:#64748b;--accent:#7c6aff;--accentlt:#a89dff;
      --green:#22c55e;--red:#ef4444;--amber:#f59e0b;--blue:#38bdf8;
    }
    body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:14px;line-height:1.5;min-height:100vh;}
    header{background:var(--surface);border-bottom:1px solid var(--border);padding:18px 32px;display:flex;align-items:center;justify-content:space-between;}
    .logo{font-size:20px;font-weight:800;color:var(--text)}.logo span{color:var(--accent)}
    .badge{background:var(--surface2);border:1px solid var(--border);border-radius:6px;padding:5px 14px;font-size:11px;font-weight:700;letter-spacing:1px;color:var(--muted);text-transform:uppercase}
    .container{max-width:1400px;margin:0 auto;padding:32px}

    /* Month selector */
    .month-bar{display:flex;align-items:center;gap:10px;margin-bottom:32px;flex-wrap:wrap}
    .month-bar h2{font-size:13px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted);margin-right:6px}
    .mbtn{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:8px 20px;font-size:13px;font-weight:700;color:var(--muted);cursor:pointer;transition:all .15s;user-select:none}
    .mbtn:hover{border-color:var(--accent);color:var(--accentlt)}
    .mbtn.active{background:rgba(124,106,255,.15);border-color:var(--accent);color:var(--accentlt)}
    .hint{font-size:11px;color:var(--muted);margin-left:4px}

    /* KPI grid */
    .kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin-bottom:28px}
    .kpi{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:20px 22px}
    .klbl{font-size:10px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:var(--accent);margin-bottom:8px}
    .kval{font-size:26px;font-weight:800;color:var(--text)}
    .ksub{font-size:11px;color:var(--muted);margin-top:4px}
    .kpi.ka{border-color:var(--accent)}.kpi.ka .kval{color:var(--accentlt)}
    .kpi.kg{border-color:var(--green)}.kpi.kg .kval{color:var(--green)}
    .kpi.kr{border-color:var(--red)}.kpi.kr .kval{color:var(--red)}

    /* Two-column grid */
    .g2{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:24px}
    .g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:20px;margin-bottom:24px}
    @media(max-width:900px){.g2,.g3{grid-template-columns:1fr}}

    /* Cards */
    .card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:22px 24px;margin-bottom:24px}
    .card-title{font-size:11px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:var(--accent);margin-bottom:16px}

    /* Tables */
    table{width:100%;border-collapse:collapse}
    th{font-size:10px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--muted);text-align:left;padding:0 0 10px}
    td{padding:8px 0;border-bottom:1px solid var(--border);font-size:13px}
    tr:last-child td{border-bottom:none}
    .num{text-align:right;font-weight:700}
    .green{color:var(--green)}.red{color:var(--red)}.amber{color:var(--amber)}

    /* Comparison view */
    .cmp-header{display:grid;gap:0;margin-bottom:0}
    .cmp-row{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:0;padding:9px 0;border-bottom:1px solid var(--border);align-items:center;font-size:13px}
    .cmp-row:last-child{border-bottom:none}
    .cmp-head{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:0;padding:0 0 10px}
    .cmp-head span{font-size:10px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--muted)}
    .cmp-head span:not(:first-child){text-align:right}
    .cmp-row span:not(:first-child){text-align:right;font-weight:700}
    .cmp-label{font-weight:600;color:var(--text)}
    .cmp-cat{font-size:11px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:var(--muted);padding:14px 0 4px;grid-column:1/-1}

    /* Delta pill */
    .delta{display:inline-block;font-size:11px;font-weight:700;border-radius:4px;padding:2px 6px}
    .delta.up{background:rgba(34,197,94,.12);color:var(--green)}
    .delta.dn{background:rgba(239,68,68,.12);color:var(--red)}
    .delta.flat{background:var(--surface2);color:var(--muted)}

    /* Bar */
    .bar-w{background:var(--surface2);border-radius:4px;height:5px;overflow:hidden;margin-top:6px}
    .bar{height:100%;border-radius:4px;background:var(--accent);transition:width .4s}

    /* Closer row */
    .closer-row{display:flex;align-items:center;gap:12px;padding:9px 0;border-bottom:1px solid var(--border)}
    .closer-row:last-child{border-bottom:none}
    .closer-name{width:90px;font-weight:600;font-size:13px;flex-shrink:0}
    .closer-bar-wrap{flex:1}
    .closer-amt{width:80px;text-align:right;font-weight:700;font-size:13px}
    .closer-cnt{width:40px;text-align:right;font-size:11px;color:var(--muted)}

    .section-title{font-size:11px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted);margin-bottom:16px}
    #main{opacity:0;transition:opacity .2s}
    #main.ready{opacity:1}
  </style>
</head>
<body>
<header>
  <div class="logo">tranchi<span>.</span>ai</div>
  <div class="badge">Overview · All Months</div>
</header>

<div class="container">
  <div class="month-bar">
    <h2>Month</h2>
    <button class="mbtn active" data-month="june">June 2026</button>
    <button class="mbtn" data-month="july">July 2026</button>
    <span class="hint">Select one or both to compare</span>
  </div>
  <div id="main"></div>
</div>

<script>
const MONTHS = {
  june: { label: 'June 2026', url: '/api/data',      color: '#7c6aff' },
  july: { label: 'July 2026', url: '/july/api/data', color: '#f59e0b' },
};

const $ = id => document.getElementById(id);
let data = {};
let selected = ['june'];

const fmt  = n => n >= 1000 ? '$' + n.toLocaleString('en-US', {minimumFractionDigits:0,maximumFractionDigits:0}) : '$' + n.toFixed(0);
const pct  = n => (n >= 0 ? '+' : '') + n.toFixed(1) + '%';
const deltaClass = n => n > 0 ? 'up' : n < 0 ? 'dn' : 'flat';

function derive(d) {
  const txns = d.transactions;
  const gross = txns.reduce((s,t) => s + t.amount, 0);
  const exp   = d.expenses.reduce((s,c) => s + c.items.reduce((ss,i) => ss + i.amount, 0), 0);
  const net   = gross - exp;
  const margin = gross > 0 ? ((net/gross)*100).toFixed(1) : 0;
  const avg   = txns.length > 0 ? Math.round(gross / txns.length) : 0;

  const closerMap = {};
  txns.forEach(t => {
    if (!closerMap[t.closer]) closerMap[t.closer] = {revenue:0, count:0};
    closerMap[t.closer].revenue += t.amount;
    closerMap[t.closer].count++;
  });
  const closers = Object.entries(closerMap).sort((a,b) => b[1].revenue - a[1].revenue);

  const whop = txns.filter(t => t.processor==='whop').reduce((s,t) => s+t.amount, 0);
  const fan  = txns.filter(t => t.processor==='fanbasis').reduce((s,t) => s+t.amount, 0);

  return {gross, exp, net, margin, avg, closers, whop, fan, txnCount: txns.length, expenses: d.expenses};
}

function renderSingle(key) {
  const d = derive(data[key]);
  const m = MONTHS[key];
  const maxRev = d.closers[0]?.[1].revenue || 1;

  const closerRows = d.closers.map(([name, c]) => `
    <div class="closer-row">
      <div class="closer-name">${name}</div>
      <div class="closer-bar-wrap">
        <div class="bar-w"><div class="bar" style="width:${(c.revenue/maxRev*100).toFixed(1)}%;background:${m.color}"></div></div>
      </div>
      <div class="closer-cnt">${c.count} sale${c.count!==1?'s':''}</div>
      <div class="closer-amt" style="color:${m.color}">${fmt(c.revenue)}</div>
    </div>`).join('');

  const expRows = d.expenses.map(cat => {
    const total = cat.items.reduce((s,i) => s+i.amount, 0);
    if (!total) return '';
    const items = cat.items.map(i => `
      <tr>
        <td style="padding-left:14px;color:var(--muted)">${i.name}</td>
        <td class="num">${fmt(i.amount)}</td>
      </tr>`).join('');
    return `
      <tr><td colspan="2" style="padding-top:14px;padding-bottom:4px">
        <span style="font-size:10px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--accent)">${cat.label}</span>
        <span style="float:right;font-weight:700">${fmt(total)}</span>
      </td></tr>
      ${items}`;
  }).join('');

  $('main').innerHTML = `
    <div class="kpi-grid">
      <div class="kpi ka"><div class="klbl">Gross Revenue</div><div class="kval">${fmt(d.gross)}</div><div class="ksub">${d.txnCount} transactions</div></div>
      <div class="kpi"><div class="klbl">Avg Deal Size</div><div class="kval">${fmt(d.avg)}</div></div>
      <div class="kpi"><div class="klbl">Whop</div><div class="kval">${fmt(d.whop)}</div></div>
      <div class="kpi"><div class="klbl">Fanbasis</div><div class="kval">${fmt(d.fan)}</div></div>
      <div class="kpi kr"><div class="klbl">Total Expenses</div><div class="kval">${fmt(d.exp)}</div></div>
      <div class="kpi kg"><div class="klbl">Net Profit</div><div class="kval">${fmt(d.net)}</div><div class="ksub">${d.margin}% margin</div></div>
    </div>
    <div class="g2">
      <div class="card">
        <div class="card-title">Revenue by Closer</div>
        ${closerRows}
      </div>
      <div class="card">
        <div class="card-title">Expense Breakdown</div>
        <table>${expRows}</table>
      </div>
    </div>`;
}

function renderComparison() {
  const [ka, kb] = selected;
  const a = derive(data[ka]), b = derive(data[kb]);
  const ma = MONTHS[ka], mb = MONTHS[kb];

  function cmpKpi(label, va, vb, fmtFn, higherIsBetter=true) {
    const diff = vb - va;
    const diffPct = va !== 0 ? (diff/Math.abs(va)*100) : 0;
    const isGood = higherIsBetter ? diff >= 0 : diff <= 0;
    const arrow = diff > 0 ? '↑' : diff < 0 ? '↓' : '→';
    const cls = diff === 0 ? 'flat' : isGood ? 'up' : 'dn';
    return `
      <div class="kpi">
        <div class="klbl">${label}</div>
        <div style="display:flex;gap:16px;margin-top:4px">
          <div>
            <div style="font-size:10px;color:${ma.color};font-weight:700;margin-bottom:2px">${ma.label}</div>
            <div style="font-size:20px;font-weight:800;color:var(--text)">${fmtFn(va)}</div>
          </div>
          <div>
            <div style="font-size:10px;color:${mb.color};font-weight:700;margin-bottom:2px">${mb.label}</div>
            <div style="font-size:20px;font-weight:800;color:var(--text)">${fmtFn(vb)}</div>
          </div>
        </div>
        <div style="margin-top:8px"><span class="delta ${cls}">${arrow} ${fmtFn(Math.abs(diff))} (${Math.abs(diffPct).toFixed(1)}%)</span></div>
      </div>`;
  }

  // Expense category comparison
  const allCats = [...new Set([
    ...a.expenses.map(c=>c.label),
    ...b.expenses.map(c=>c.label)
  ])];
  const expRows = allCats.map(label => {
    const catA = a.expenses.find(c=>c.label===label);
    const catB = b.expenses.find(c=>c.label===label);
    const totA = catA ? catA.items.reduce((s,i)=>s+i.amount,0) : 0;
    const totB = catB ? catB.items.reduce((s,i)=>s+i.amount,0) : 0;
    const diff = totB - totA;
    const cls = diff === 0 ? 'flat' : diff > 0 ? 'dn' : 'up'; // more expense = bad
    const arrow = diff > 0 ? '↑' : diff < 0 ? '↓' : '→';
    return `
      <div class="cmp-row">
        <span class="cmp-label">${label}</span>
        <span style="color:${ma.color}">${totA ? fmt(totA) : '—'}</span>
        <span style="color:${mb.color}">${totB ? fmt(totB) : '—'}</span>
        <span><span class="delta ${cls}">${arrow} ${fmt(Math.abs(diff))}</span></span>
      </div>`;
  }).join('');

  // Closer comparison
  const allClosers = [...new Set([
    ...a.closers.map(c=>c[0]),
    ...b.closers.map(c=>c[0])
  ])].sort((x,y) => {
    const ra = a.closers.find(c=>c[0]===x)?.[1].revenue || 0;
    const rb = b.closers.find(c=>c[0]===y)?.[1].revenue || 0;
    return (rb + (b.closers.find(c=>c[0]===y)?.[1].revenue||0)) - (ra + (a.closers.find(c=>c[0]===x)?.[1].revenue||0));
  });

  const closerRows = allClosers.map(name => {
    const ca = a.closers.find(c=>c[0]===name)?.[1] || {revenue:0,count:0};
    const cb = b.closers.find(c=>c[0]===name)?.[1] || {revenue:0,count:0};
    const diff = cb.revenue - ca.revenue;
    const cls = diff >= 0 ? 'up' : 'dn';
    const arrow = diff > 0 ? '↑' : diff < 0 ? '↓' : '→';
    return `
      <div class="cmp-row">
        <span class="cmp-label">${name}</span>
        <span style="color:${ma.color}">${ca.revenue ? fmt(ca.revenue) : '—'}<span style="font-size:11px;color:var(--muted);font-weight:400"> ×${ca.count}</span></span>
        <span style="color:${mb.color}">${cb.revenue ? fmt(cb.revenue) : '—'}<span style="font-size:11px;color:var(--muted);font-weight:400"> ×${cb.count}</span></span>
        <span><span class="delta ${cls}">${arrow} ${fmt(Math.abs(diff))}</span></span>
      </div>`;
  }).join('');

  $('main').innerHTML = `
    <div class="kpi-grid" style="grid-template-columns:repeat(auto-fit,minmax(240px,1fr))">
      ${cmpKpi('Gross Revenue', a.gross, b.gross, fmt)}
      ${cmpKpi('Total Transactions', a.txnCount, b.txnCount, n => n.toString())}
      ${cmpKpi('Avg Deal Size', a.avg, b.avg, fmt)}
      ${cmpKpi('Total Expenses', a.exp, b.exp, fmt, false)}
      ${cmpKpi('Net Profit', a.net, b.net, fmt)}
      ${cmpKpi('Net Margin', parseFloat(a.margin), parseFloat(b.margin), n => n.toFixed(1)+'%')}
    </div>

    <div class="g2">
      <div class="card">
        <div class="card-title">Expense Categories</div>
        <div class="cmp-head">
          <span>Category</span>
          <span style="color:${ma.color}">${ma.label}</span>
          <span style="color:${mb.color}">${mb.label}</span>
          <span>Change</span>
        </div>
        ${expRows}
      </div>
      <div class="card">
        <div class="card-title">Revenue by Closer</div>
        <div class="cmp-head">
          <span>Closer</span>
          <span style="color:${ma.color}">${ma.label}</span>
          <span style="color:${mb.color}">${mb.label}</span>
          <span>Change</span>
        </div>
        ${closerRows}
      </div>
    </div>`;
}

function render() {
  $('main').classList.remove('ready');
  setTimeout(() => {
    if (selected.length === 1) renderSingle(selected[0]);
    else renderComparison();
    $('main').classList.add('ready');
  }, 50);
}

// Month toggle logic
document.querySelectorAll('.mbtn').forEach(btn => {
  btn.addEventListener('click', () => {
    const m = btn.dataset.month;
    if (selected.includes(m)) {
      if (selected.length === 1) return; // always keep at least one
      selected = selected.filter(s => s !== m);
      btn.classList.remove('active');
    } else {
      selected.push(m);
      btn.classList.add('active');
    }
    render();
  });
});

// Load all month data
Promise.all(
  Object.entries(MONTHS).map(([key, m]) =>
    fetch(m.url).then(r => r.json()).then(d => { data[key] = d; })
  )
).then(render);
</script>
</body>
</html>
