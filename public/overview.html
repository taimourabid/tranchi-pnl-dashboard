<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tranchi AI — Overview</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg:#dce9e3; --surface:#2c2a24; --surface2:#38362f; --border:#48463e;
      --text:#f0ece6; --muted:#9a9588; --accent:#c49535; --accentlt:#e8c06b;
      --red:#d95f5f; --green:#5cb87a;
    }
    body { background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; font-size:14px; line-height:1.5; }
    header { background:var(--surface); border-bottom:1px solid var(--border); padding:18px 32px; display:flex; align-items:center; justify-content:space-between; }
    .logo { font-size:20px; font-weight:800; color:var(--text); }
    .logo span { color:var(--accent); }
    .hdr-right { display:flex; align-items:center; gap:12px; }
    .badge { background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:5px 14px; font-size:11px; font-weight:700; letter-spacing:1px; color:var(--muted); text-transform:uppercase; }
    .container { max-width:1400px; margin:0 auto; padding:32px; }
    .slabel { font-size:11px; font-weight:700; letter-spacing:1.4px; text-transform:uppercase; color:var(--accent); margin-bottom:14px; }
    .card { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:24px; }
    .ctitle { font-size:12px; font-weight:700; color:var(--text); margin-bottom:18px; }
    .kpi-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(185px,1fr)); gap:14px; margin-bottom:28px; }
    .g21 { display:grid; grid-template-columns:2fr 1fr; gap:14px; margin-bottom:26px; }
    .g11 { display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-bottom:26px; }
    .g3  { display:grid; grid-template-columns:1fr 1fr 1fr; gap:14px; margin-bottom:26px; }
    .kpi { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:20px 22px; }
    .klbl { font-size:10px; font-weight:700; letter-spacing:1.2px; text-transform:uppercase; color:var(--accent); margin-bottom:8px; }
    .kval { font-size:26px; font-weight:800; color:var(--text); }
    .ksub { font-size:11px; color:var(--muted); margin-top:4px; }
    .kpi.ka { border-color:var(--accent); } .kpi.ka .kval { color:var(--accentlt); }
    .kpi.kg { border-color:var(--green); }  .kpi.kg .kval { color:var(--green); }
    .kpi.kr { border-color:var(--red); }    .kpi.kr .kval { color:var(--red); }
    .lb { list-style:none; }
    .lbi { display:flex; align-items:center; gap:10px; padding:9px 0; border-bottom:1px solid var(--border); }
    .lbi:last-child { border-bottom:none; }
    .lbrank { font-size:11px; font-weight:800; color:var(--muted); width:18px; text-align:center; }
    .lbname { flex:1; font-weight:600; font-size:13px; }
    .lbbar-w { flex:2; background:var(--surface2); border-radius:4px; height:5px; overflow:hidden; }
    .lbbar   { height:100%; border-radius:4px; }
    .lbamt   { font-weight:700; font-size:13px; min-width:68px; text-align:right; }
    .lbcnt   { font-size:11px; color:var(--muted); min-width:40px; text-align:right; }
    .pnl-sec { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:22px 24px; }
    .pnl-sec.profit { border-color:var(--green); }
    .pi { display:flex; justify-content:space-between; align-items:center; padding:7px 0; border-bottom:1px solid var(--border); font-size:13px; }
    .pi:last-child { border-bottom:none; }
    .pi.tot { padding-top:12px; border-top:1px solid var(--border); border-bottom:none; font-weight:800; font-size:14px; margin-top:4px; }
    .pos { color:var(--green); font-weight:700; }
    .neg { color:var(--red);   font-weight:700; }
    .neu { color:var(--accentlt); font-weight:700; }
    .exp-cats { display:grid; grid-template-columns:repeat(auto-fit,minmax(205px,1fr)); gap:12px; }
    .ec { background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:16px 18px; }
    .eclbl { font-size:10px; font-weight:700; letter-spacing:1px; text-transform:uppercase; color:var(--accent); margin-bottom:5px; }
    .ectot { font-size:20px; font-weight:800; }
    .eitems { margin-top:8px; font-size:11px; color:var(--muted); line-height:2; }
    .erow { display:flex; align-items:center; gap:6px; }
    .ename { flex:1; }
    .eamt  { font-variant-numeric:tabular-nums; white-space:nowrap; }
    .table-wrap { background:var(--surface); border:1px solid var(--border); border-radius:12px; overflow:hidden; margin-bottom:28px; }
    .thdr { display:flex; justify-content:space-between; align-items:center; padding:18px 22px 14px; border-bottom:1px solid var(--border); }
    table { width:100%; border-collapse:collapse; }
    thead th { background:var(--surface2); padding:9px 16px; font-size:10px; font-weight:700; letter-spacing:1.2px; text-transform:uppercase; color:var(--accent); text-align:left; }
    tbody tr { border-bottom:1px solid var(--border); transition:background .1s; }
    tbody tr:last-child { border-bottom:none; }
    tbody tr:hover { background:var(--surface2); }
    td { padding:9px 16px; font-size:13px; }
    .tag { display:inline-block; padding:2px 8px; border-radius:4px; font-size:10px; font-weight:700; }
    .twh { background:rgba(196,149,53,.18); color:var(--accentlt); }
    .tfb { background:rgba(92,184,122,.15); color:var(--green); }
    .ac { font-weight:700; font-variant-numeric:tabular-nums; }

    /* Month selector */
    .month-bar { display:flex; align-items:center; gap:10px; margin-bottom:28px; flex-wrap:wrap; }
    .month-bar-label { font-size:11px; font-weight:700; letter-spacing:1.2px; text-transform:uppercase; color:var(--muted); margin-right:4px; }
    .mbtn { background:var(--surface); border:1px solid var(--border); border-radius:8px; padding:8px 22px; font-size:11px; font-weight:700; letter-spacing:.8px; text-transform:uppercase; color:var(--muted); cursor:pointer; transition:all .15s; }
    .mbtn:hover { border-color:var(--accent); color:var(--accentlt); }
    .mbtn.on { background:rgba(196,149,53,.15); border-color:var(--accent); color:var(--accentlt); }
    .month-hint { font-size:11px; color:var(--muted); margin-left:6px; }

    /* Comparison KPI card */
    .cmp-kpi-vals { display:flex; gap:20px; margin-top:6px; }
    .cmp-kpi-col { }
    .cmp-month-label { font-size:10px; font-weight:700; letter-spacing:.8px; text-transform:uppercase; margin-bottom:3px; }
    .cmp-kval { font-size:20px; font-weight:800; color:var(--text); }
    .cmp-delta { margin-top:8px; }
    .delta-pill { display:inline-block; font-size:11px; font-weight:700; border-radius:4px; padding:2px 7px; }
    .delta-up   { background:rgba(92,184,122,.15); color:var(--green); }
    .delta-dn   { background:rgba(217,95,95,.15);  color:var(--red); }
    .delta-flat { background:var(--surface2); color:var(--muted); }

    /* Comparison leaderboard */
    .cmp-lb-wrap { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
    .cmp-lb-title { font-size:10px; font-weight:700; letter-spacing:1px; text-transform:uppercase; margin-bottom:12px; }

    /* Comparison P&L row table */
    .cmp-pnl { width:100%; border-collapse:collapse; }
    .cmp-pnl th { font-size:10px; font-weight:700; letter-spacing:1px; text-transform:uppercase; color:var(--muted); padding:0 0 10px; text-align:left; }
    .cmp-pnl th:not(:first-child) { text-align:right; }
    .cmp-pnl td { padding:8px 0; border-bottom:1px solid var(--border); font-size:13px; }
    .cmp-pnl tr:last-child td { border-bottom:none; }
    .cmp-pnl td:not(:first-child) { text-align:right; font-weight:700; }
    .cmp-pnl tr.tot td { font-weight:800; font-size:14px; padding-top:12px; border-top:2px solid var(--border); border-bottom:none; }

    @media(max-width:960px){ .g21,.g11,.g3,.cmp-lb-wrap{grid-template-columns:1fr;} .container{padding:16px;} }
  </style>
</head>
<body>
<header>
  <div class="logo">Tranchi <span>AI</span></div>
  <div class="hdr-right">
    <div class="badge">Overview · All Months</div>
  </div>
</header>
<div class="container">
  <div class="month-bar">
    <span class="month-bar-label">Month</span>
    <button class="mbtn on" data-key="june">June 2026</button>
    <button class="mbtn"    data-key="july">July 2026</button>
    <span class="month-hint">Select one or both to compare</span>
  </div>
  <div id="content"></div>
</div>
<script>
const C={gold:'#c49535',goldlt:'#e8c06b',green:'#5cb87a',red:'#d95f5f',teal:'#4ab3a0',blue:'#5b8fd4',purple:'#9b7dd4',orange:'#d4834b',grid:'#48463e',tick:'#9a9588'};
const CC=[C.red,C.orange,C.purple,C.blue,C.teal,C.green,C.gold,C.goldlt];
const LC=[C.goldlt,C.gold,C.green,C.teal,C.blue,C.purple,C.orange,C.red];

const MONTHS = {
  june: { label:'June 2026', short:'Jun', url:'/api/data',      color:C.gold,  colorlt:C.goldlt },
  july: { label:'July 2026', short:'Jul', url:'/july/api/data', color:C.blue,  colorlt:'#89c4f4' },
};

let allData = {};
let selected = ['june'];
let charts = {};

function f(n)  { return Math.round(n).toLocaleString(); }
function fd(n) { return n%1===0 ? n.toLocaleString() : n.toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2}); }

function der(d, key) {
  const pfx = MONTHS[key].short;
  const gross = d.transactions.reduce((s,t)=>s+t.amount,0);
  const whop  = d.transactions.filter(t=>t.processor==='whop').reduce((s,t)=>s+t.amount,0);
  const fan   = d.transactions.filter(t=>t.processor==='fanbasis').reduce((s,t)=>s+t.amount,0);
  const exp   = d.expenses.reduce((s,c)=>s+c.items.reduce((ss,i)=>ss+i.amount,0),0);
  const net   = gross - exp;
  const margin = gross>0 ? ((net/gross)*100).toFixed(2) : '0.00';
  const avg   = d.transactions.length>0 ? Math.round(gross/d.transactions.length) : 0;
  const cm = {};
  d.transactions.forEach(t=>{if(!cm[t.closer])cm[t.closer]={total:0,count:0};cm[t.closer].total+=t.amount;cm[t.closer].count++;});
  const closers = Object.entries(cm).sort((a,b)=>b[1].total-a[1].total);
  const wd = {[`${pfx} 1-7`]:0,[`${pfx} 8-14`]:0,[`${pfx} 15-21`]:0,[`${pfx} 22+`]:0};
  d.transactions.forEach(t=>{const day=parseInt(t.date.split('/')[0]);if(day<=7)wd[`${pfx} 1-7`]+=t.amount;else if(day<=14)wd[`${pfx} 8-14`]+=t.amount;else if(day<=21)wd[`${pfx} 15-21`]+=t.amount;else wd[`${pfx} 22+`]+=t.amount;});
  const dm = {};
  d.transactions.forEach(t=>{const day=t.date.split('/')[0];dm[day]=(dm[day]||0)+t.amount;});
  return {gross,whop,fan,exp,net,margin,avg,closers,wd,dm,txnCount:d.transactions.length,expenses:d.expenses,transactions:d.transactions};
}

function destroyCharts() { Object.values(charts).forEach(c=>{try{c.destroy();}catch(e){}}); charts={}; }

function renderSingle(key) {
  const d = der(allData[key], key);
  const m = MONTHS[key];
  const tk={color:C.tick}, gr={color:C.grid}, yf={callback:v=>'$'+(v/1000).toFixed(0)+'k'};

  const expCats = d.expenses.map((cat,ci)=>{
    const tot = cat.items.reduce((s,i)=>s+i.amount,0);
    const items = cat.items.map(item=>`<div class="erow"><span class="ename">${item.name}</span><span class="eamt">$${fd(item.amount)}</span></div>`).join('');
    return `<div class="ec"><div class="eclbl">${cat.label}</div><div class="ectot" style="color:${CC[ci]||C.red}">-$${fd(tot)}</div><div class="eitems">${items}</div></div>`;
  }).join('');

  const expRows = d.expenses.map(c=>{const t=c.items.reduce((s,i)=>s+i.amount,0);return`<div class="pi"><span>${c.label}</span><span class="neg">-$${f(t)}</span></div>`;}).join('');

  const txnRows = d.transactions.map((t,i)=>`<tr><td style="color:var(--muted)">${i+1}</td><td style="color:var(--muted)">${t.date}</td><td style="font-weight:600">${t.name}</td><td style="color:var(--muted)">${t.closer}</td><td><span class="tag ${t.processor==='whop'?'twh':'tfb'}">${t.processor}</span></td><td class="ac" style="text-align:right">$${f(t.amount)}</td></tr>`).join('');

  const lbItems = d.closers.map(([n,v],i)=>`<li class="lbi"><span class="lbrank">${i+1}</span><span class="lbname">${n}</span><div class="lbbar-w"><div class="lbbar" style="width:${d.closers[0]?((v.total/d.closers[0][1].total)*100).toFixed(1):0}%;background:${LC[i]||C.gold}"></div></div><span class="lbamt">$${f(v.total)}</span><span class="lbcnt">${v.count} sales</span></li>`).join('');

  document.getElementById('content').innerHTML = `
    <div class="slabel">Revenue Overview</div>
    <div class="kpi-grid">
      <div class="kpi ka"><div class="klbl">Gross Revenue</div><div class="kval">$${f(d.gross)}</div><div class="ksub">${d.txnCount} transactions</div></div>
      <div class="kpi"><div class="klbl">Total Sales</div><div class="kval">${d.txnCount}</div><div class="ksub">${d.closers.length} closers</div></div>
      <div class="kpi"><div class="klbl">Avg Deal Size</div><div class="kval">$${f(d.avg)}</div><div class="ksub">${m.label}</div></div>
      <div class="kpi"><div class="klbl">Whop</div><div class="kval">$${f(d.whop)}</div><div class="ksub">${allData[key].transactions.filter(t=>t.processor==='whop').length} txns</div></div>
      <div class="kpi"><div class="klbl">Fanbasis</div><div class="kval">$${f(d.fan)}</div><div class="ksub">${allData[key].transactions.filter(t=>t.processor==='fanbasis').length} txns</div></div>
      <div class="kpi kr"><div class="klbl">Total Expenses</div><div class="kval">$${f(d.exp)}</div><div class="ksub">${d.expenses.length} categories</div></div>
      <div class="kpi kg"><div class="klbl">Net Profit</div><div class="kval">$${f(d.net)}</div><div class="ksub">${d.margin}% margin</div></div>
    </div>
    <div class="g21">
      <div class="card"><div class="ctitle">Weekly Revenue</div><div style="position:relative;height:220px"><canvas id="wChart"></canvas></div></div>
      <div class="card"><div class="ctitle">Revenue by Processor</div><div style="position:relative;height:220px"><canvas id="pChart"></canvas></div></div>
    </div>
    <div class="g11">
      <div class="card"><div class="ctitle">Revenue by Closer</div><div style="position:relative;height:240px"><canvas id="cChart"></canvas></div></div>
      <div class="card"><div class="ctitle">Closer Leaderboard</div><ul class="lb">${lbItems}</ul></div>
    </div>
    <div class="card" style="margin-bottom:26px">
      <div class="ctitle">Daily Revenue — ${m.label}</div>
      <div style="position:relative;height:190px"><canvas id="dChart"></canvas></div>
    </div>
    <div class="slabel">Profit &amp; Loss Summary</div>
    <div class="g3">
      <div class="pnl-sec"><div class="slabel" style="margin-bottom:10px">Revenue</div><div class="pi"><span>Whop</span><span class="pos">$${f(d.whop)}</span></div><div class="pi"><span>Fanbasis</span><span class="pos">$${f(d.fan)}</span></div><div class="pi tot"><span>Gross Revenue</span><span class="pos">$${f(d.gross)}</span></div></div>
      <div class="pnl-sec"><div class="slabel" style="margin-bottom:10px">Expenses</div>${expRows}<div class="pi tot"><span>Total Expenses</span><span class="neg">-$${f(d.exp)}</span></div></div>
      <div class="pnl-sec profit"><div class="slabel" style="margin-bottom:10px">Net Profit</div><div class="pi"><span>Gross Revenue</span><span class="pos">$${f(d.gross)}</span></div><div class="pi"><span>Total Expenses</span><span class="neg">-$${f(d.exp)}</span></div><div class="pi"><span>Profit Margin</span><span class="neu">${d.margin}%</span></div><div class="pi tot"><span>Net Profit</span><span class="${d.net>=0?'pos':'neg'}">$${f(d.net)}</span></div></div>
    </div>
    <div class="slabel">Expense Breakdown by Category</div>
    <div class="g21" style="align-items:start;margin-bottom:26px">
      <div class="exp-cats">${expCats}</div>
      <div class="card"><div class="ctitle">Expense Mix</div><div style="position:relative;height:280px"><canvas id="eChart"></canvas></div></div>
    </div>
    <div class="table-wrap">
      <div class="thdr"><div class="ctitle" style="margin:0">All Transactions</div><div style="font-size:12px;color:var(--muted)">${d.txnCount} entries · ${m.label}</div></div>
      <table><thead><tr><th>#</th><th>Date</th><th>Client</th><th>Closer</th><th>Processor</th><th style="text-align:right">Amount</th></tr></thead><tbody>${txnRows}</tbody></table>
    </div>`;

  destroyCharts();
  const wdKeys = Object.keys(d.wd), wdVals = Object.values(d.wd);
  charts.w = new Chart(document.getElementById('wChart'),{type:'bar',data:{labels:wdKeys,datasets:[{data:wdVals,backgroundColor:[m.color,m.colorlt,m.color,m.colorlt],borderRadius:8}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>' $'+c.raw.toLocaleString()}}},scales:{x:{grid:{display:false},ticks:tk},y:{grid:gr,ticks:{...tk,...yf}}}}});
  charts.p = new Chart(document.getElementById('pChart'),{type:'doughnut',data:{labels:['Whop','Fanbasis'],datasets:[{data:[d.whop,d.fan],backgroundColor:[m.color,C.green],borderWidth:0,hoverOffset:6}]},options:{responsive:true,maintainAspectRatio:false,cutout:'65%',plugins:{legend:{position:'bottom',labels:{color:C.tick,padding:16,font:{size:12}}},tooltip:{callbacks:{label:c=>' $'+c.raw.toLocaleString()}}}}});
  charts.c = new Chart(document.getElementById('cChart'),{type:'bar',data:{labels:d.closers.map(([n])=>n),datasets:[{data:d.closers.map(([,v])=>v.total),backgroundColor:LC,borderRadius:6}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:{grid:gr,ticks:tk},y:{grid:gr,ticks:{...tk,...yf}}}}});
  const dd = Object.keys(d.dm).sort((a,b)=>parseInt(a)-parseInt(b));
  charts.d = new Chart(document.getElementById('dChart'),{type:'bar',data:{labels:dd.map(x=>m.short+' '+parseInt(x)),datasets:[{data:dd.map(x=>d.dm[x]),backgroundColor:m.color,borderRadius:5}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>' $'+c.raw.toLocaleString()}}},scales:{x:{grid:{display:false},ticks:{...tk,font:{size:11}}},y:{grid:gr,ticks:{...tk,...yf}}}}});
  const ea = d.expenses.map(c=>c.items.reduce((s,i)=>s+i.amount,0));
  charts.e = new Chart(document.getElementById('eChart'),{type:'doughnut',data:{labels:d.expenses.map(c=>c.label),datasets:[{data:ea,backgroundColor:CC,borderWidth:0,hoverOffset:6}]},options:{responsive:true,maintainAspectRatio:false,cutout:'58%',plugins:{legend:{position:'bottom',labels:{color:C.tick,padding:9,font:{size:11},boxWidth:11}},tooltip:{callbacks:{label:c=>' $'+c.raw.toLocaleString()}}}}});
}

function renderComparison() {
  const [ka, kb] = selected;
  const a = der(allData[ka], ka), b = der(allData[kb], kb);
  const ma = MONTHS[ka], mb = MONTHS[kb];
  const tk={color:C.tick}, gr={color:C.grid}, yf={callback:v=>'$'+(v/1000).toFixed(0)+'k'};

  function deltaPill(va, vb, higherGood=true) {
    const diff = vb - va;
    const pct  = va !== 0 ? Math.abs(diff/va*100).toFixed(1) : '—';
    const good = higherGood ? diff >= 0 : diff <= 0;
    const cls  = diff === 0 ? 'delta-flat' : good ? 'delta-up' : 'delta-dn';
    const arrow= diff > 0 ? '↑' : diff < 0 ? '↓' : '→';
    return `<span class="delta-pill ${cls}">${arrow} $${f(Math.abs(diff))} (${pct}%)</span>`;
  }

  function cmpKpi(label, va, vb, fmtA, fmtB, higherGood=true) {
    return `<div class="kpi">
      <div class="klbl">${label}</div>
      <div class="cmp-kpi-vals">
        <div class="cmp-kpi-col"><div class="cmp-month-label" style="color:${ma.color}">${ma.label}</div><div class="cmp-kval">${fmtA(va)}</div></div>
        <div class="cmp-kpi-col"><div class="cmp-month-label" style="color:${mb.color}">${mb.label}</div><div class="cmp-kval">${fmtB(vb)}</div></div>
      </div>
      <div class="cmp-delta">${deltaPill(va, vb, higherGood)}</div>
    </div>`;
  }

  // Expense table comparison
  const allCats = [...new Set([...a.expenses.map(c=>c.label),...b.expenses.map(c=>c.label)])];
  const expRows = allCats.map(lbl=>{
    const totA = (a.expenses.find(c=>c.label===lbl)||{items:[]}).items.reduce((s,i)=>s+i.amount,0);
    const totB = (b.expenses.find(c=>c.label===lbl)||{items:[]}).items.reduce((s,i)=>s+i.amount,0);
    const diff = totB - totA;
    const cls  = diff===0?'delta-flat':diff>0?'delta-dn':'delta-up';
    const arrow= diff>0?'↑':diff<0?'↓':'→';
    return `<tr><td>${lbl}</td><td style="color:${ma.color}">${totA?'$'+f(totA):'—'}</td><td style="color:${mb.color}">${totB?'$'+f(totB):'—'}</td><td><span class="delta-pill ${cls}">${arrow} $${f(Math.abs(diff))}</span></td></tr>`;
  }).join('');

  // Closer table comparison
  const allClosers = [...new Set([...a.closers.map(c=>c[0]),...b.closers.map(c=>c[0])])];
  allClosers.sort((x,y)=>{
    const ra=(a.closers.find(c=>c[0]===x)||[,{total:0}])[1].total+(b.closers.find(c=>c[0]===x)||[,{total:0}])[1].total;
    const rb=(a.closers.find(c=>c[0]===y)||[,{total:0}])[1].total+(b.closers.find(c=>c[0]===y)||[,{total:0}])[1].total;
    return rb-ra;
  });
  const closerRows = allClosers.map(n=>{
    const ca=(a.closers.find(c=>c[0]===n)||[,{total:0,count:0}])[1];
    const cb=(b.closers.find(c=>c[0]===n)||[,{total:0,count:0}])[1];
    const diff=cb.total-ca.total;
    const cls=diff===0?'delta-flat':diff>0?'delta-up':'delta-dn';
    const arrow=diff>0?'↑':diff<0?'↓':'→';
    return `<tr>
      <td style="font-weight:600">${n}</td>
      <td style="color:${ma.color}">${ca.total?'$'+f(ca.total):'—'}<span style="color:var(--muted);font-size:11px;font-weight:400">${ca.count?' ×'+ca.count:''}</span></td>
      <td style="color:${mb.color}">${cb.total?'$'+f(cb.total):'—'}<span style="color:var(--muted);font-size:11px;font-weight:400">${cb.count?' ×'+cb.count:''}</span></td>
      <td><span class="delta-pill ${cls}">${arrow} $${f(Math.abs(diff))}</span></td>
    </tr>`;
  }).join('');

  // P&L rows for each month
  function pnlSec(d, m) {
    const expR = d.expenses.map(c=>{const t=c.items.reduce((s,i)=>s+i.amount,0);return`<div class="pi"><span>${c.label}</span><span class="neg">-$${f(t)}</span></div>`;}).join('');
    return `<div>
      <div class="pnl-sec" style="margin-bottom:12px">
        <div class="slabel" style="margin-bottom:10px;color:${m.color}">Revenue · ${m.label}</div>
        <div class="pi"><span>Whop</span><span class="pos">$${f(d.whop)}</span></div>
        <div class="pi"><span>Fanbasis</span><span class="pos">$${f(d.fan)}</span></div>
        <div class="pi tot"><span>Gross Revenue</span><span class="pos">$${f(d.gross)}</span></div>
      </div>
      <div class="pnl-sec" style="margin-bottom:12px">
        <div class="slabel" style="margin-bottom:10px;color:${m.color}">Expenses · ${m.label}</div>
        ${expR}
        <div class="pi tot"><span>Total Expenses</span><span class="neg">-$${f(d.exp)}</span></div>
      </div>
      <div class="pnl-sec profit">
        <div class="slabel" style="margin-bottom:10px;color:${m.color}">Net · ${m.label}</div>
        <div class="pi"><span>Gross Revenue</span><span class="pos">$${f(d.gross)}</span></div>
        <div class="pi"><span>Total Expenses</span><span class="neg">-$${f(d.exp)}</span></div>
        <div class="pi"><span>Profit Margin</span><span class="neu">${d.margin}%</span></div>
        <div class="pi tot"><span>Net Profit</span><span class="${d.net>=0?'pos':'neg'}">$${f(d.net)}</span></div>
      </div>
    </div>`;
  }

  document.getElementById('content').innerHTML = `
    <div class="slabel">Revenue Comparison</div>
    <div class="kpi-grid" style="grid-template-columns:repeat(auto-fit,minmax(220px,1fr));margin-bottom:28px">
      ${cmpKpi('Gross Revenue',    a.gross,    b.gross,    v=>'$'+f(v), v=>'$'+f(v))}
      ${cmpKpi('Total Sales',      a.txnCount, b.txnCount, v=>v,        v=>v)}
      ${cmpKpi('Avg Deal Size',    a.avg,      b.avg,      v=>'$'+f(v), v=>'$'+f(v))}
      ${cmpKpi('Total Expenses',   a.exp,      b.exp,      v=>'$'+f(v), v=>'$'+f(v), false)}
      ${cmpKpi('Net Profit',       a.net,      b.net,      v=>'$'+f(v), v=>'$'+f(v))}
      ${cmpKpi('Net Margin',       parseFloat(a.margin), parseFloat(b.margin), v=>v.toFixed(1)+'%', v=>v.toFixed(1)+'%')}
    </div>
    <div class="g11">
      <div class="card"><div class="ctitle">Weekly Revenue — ${ma.label} vs ${mb.label}</div><div style="position:relative;height:240px"><canvas id="wChart"></canvas></div></div>
      <div class="card"><div class="ctitle">Revenue by Closer — ${ma.label} vs ${mb.label}</div><div style="position:relative;height:240px"><canvas id="cChart"></canvas></div></div>
    </div>
    <div class="slabel">Profit &amp; Loss</div>
    <div class="g11" style="align-items:start">
      ${pnlSec(a, ma)}
      ${pnlSec(b, mb)}
    </div>
    <div class="slabel">Expense Comparison</div>
    <div class="table-wrap" style="margin-bottom:26px">
      <div class="thdr"><div class="ctitle" style="margin:0">Expense Categories</div></div>
      <table class="cmp-pnl">
        <thead><tr><th>Category</th><th style="color:${ma.color};text-align:right">${ma.label}</th><th style="color:${mb.color};text-align:right">${mb.label}</th><th style="text-align:right">Change</th></tr></thead>
        <tbody>${expRows}</tbody>
      </table>
    </div>
    <div class="slabel">Closer Comparison</div>
    <div class="table-wrap">
      <div class="thdr"><div class="ctitle" style="margin:0">Revenue by Closer</div></div>
      <table class="cmp-pnl">
        <thead><tr><th>Closer</th><th style="color:${ma.color};text-align:right">${ma.label}</th><th style="color:${mb.color};text-align:right">${mb.label}</th><th style="text-align:right">Change</th></tr></thead>
        <tbody>${closerRows}</tbody>
      </table>
    </div>`;

  destroyCharts();

  // Weekly grouped bar
  const weeks = ['1-7','8-14','15-21','22+'];
  const wLabels = weeks.map(w=>`Week ${w}`);
  const wA = weeks.map(w=>a.wd[`${ma.short} ${w}`]||0);
  const wB = weeks.map(w=>b.wd[`${mb.short} ${w}`]||0);
  charts.w = new Chart(document.getElementById('wChart'),{type:'bar',data:{labels:wLabels,datasets:[{label:ma.label,data:wA,backgroundColor:ma.color,borderRadius:6},{label:mb.label,data:wB,backgroundColor:mb.color,borderRadius:6}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'bottom',labels:{color:C.tick,padding:14,font:{size:12}}},tooltip:{callbacks:{label:c=>' $'+c.raw.toLocaleString()}}},scales:{x:{grid:{display:false},ticks:tk},y:{grid:gr,ticks:{...tk,...yf}}}}});

  // Closer grouped bar (top 10)
  const topClosers = allClosers.slice(0,10);
  const cA = topClosers.map(n=>(a.closers.find(c=>c[0]===n)||[,{total:0}])[1].total);
  const cB = topClosers.map(n=>(b.closers.find(c=>c[0]===n)||[,{total:0}])[1].total);
  charts.c = new Chart(document.getElementById('cChart'),{type:'bar',data:{labels:topClosers,datasets:[{label:ma.label,data:cA,backgroundColor:ma.color,borderRadius:5},{label:mb.label,data:cB,backgroundColor:mb.color,borderRadius:5}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'bottom',labels:{color:C.tick,padding:14,font:{size:12}}},tooltip:{callbacks:{label:c=>' $'+c.raw.toLocaleString()}}},scales:{x:{grid:{display:false},ticks:tk},y:{grid:gr,ticks:{...tk,...yf}}}}});
}

function render() {
  destroyCharts();
  if (selected.length === 1) renderSingle(selected[0]);
  else renderComparison();
}

document.querySelectorAll('.mbtn').forEach(btn => {
  btn.addEventListener('click', () => {
    const key = btn.dataset.key;
    if (selected.includes(key)) {
      if (selected.length === 1) return;
      selected = selected.filter(s => s !== key);
      btn.classList.remove('on');
    } else {
      selected.push(key);
      btn.classList.add('on');
    }
    render();
  });
});

Promise.all(
  Object.entries(MONTHS).map(([key,m]) =>
    fetch(m.url).then(r=>r.json()).then(d=>{ allData[key]=d; })
  )
).then(render);
</script>
</body>
</html>
