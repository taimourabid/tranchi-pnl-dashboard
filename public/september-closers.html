<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tranchi AI — September 2026 Closer Cash Collected</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:       #dce9e3;
      --surface:  #2c2a24;
      --surface2: #38362f;
      --surface3: #1e1d18;
      --border:   #48463e;
      --text:     #f0ece6;
      --muted:    #9a9588;
      --accent:   #c49535;
      --accent-lt:#e8c06b;
      --green:    #5cb87a;
      --gold1:    #c49535;
      --gold2:    #9a7428;
      --gold3:    #7a5c1e;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 14px;
      line-height: 1.5;
    }

    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 20px 36px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .logo { font-size: 20px; font-weight: 800; letter-spacing: -0.5px; color: var(--text); }
    .logo span { color: var(--accent); }

    .badge {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 5px 14px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1px;
      color: var(--muted);
      text-transform: uppercase;
    }

    .container {
      max-width: 1300px;
      margin: 0 auto;
      padding: 36px;
    }

    .section-label {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1.4px;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 14px;
    }

    /* ── SUMMARY CARDS ── */
    .summary-row {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 16px;
      margin-bottom: 36px;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 20px 24px;
    }

    .card-label {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 6px;
    }

    .card-value {
      font-size: 26px;
      font-weight: 800;
      color: var(--accent-lt);
      letter-spacing: -1px;
    }

    .card-sub {
      font-size: 12px;
      color: var(--muted);
      margin-top: 2px;
    }

    /* ── CHART ── */
    .chart-wrap {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 28px;
      margin-bottom: 36px;
    }

    .chart-title {
      font-size: 13px;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 20px;
    }

    canvas { width: 100% !important; }

    /* ── LEADERBOARD ── */
    .leaderboard {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
      margin-bottom: 36px;
    }

    .lb-header {
      display: grid;
      grid-template-columns: 48px 1fr 120px 100px 140px;
      gap: 0;
      padding: 12px 20px;
      border-bottom: 1px solid var(--border);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: var(--muted);
    }

    .lb-row {
      display: grid;
      grid-template-columns: 48px 1fr 120px 100px 140px;
      gap: 0;
      padding: 14px 20px;
      border-bottom: 1px solid var(--border);
      align-items: center;
      cursor: pointer;
      transition: background 0.15s;
    }

    .lb-row:last-child { border-bottom: none; }
    .lb-row:hover { background: var(--surface2); }

    .rank {
      font-size: 18px;
      font-weight: 900;
      color: var(--muted);
    }

    .rank.r1 { color: #ffd700; }
    .rank.r2 { color: #c0c0c0; }
    .rank.r3 { color: #cd7f32; }

    .closer-name {
      font-size: 15px;
      font-weight: 700;
      color: var(--text);
    }

    .bar-cell {
      padding-right: 20px;
    }

    .bar-track {
      height: 8px;
      background: var(--surface2);
      border-radius: 4px;
      overflow: hidden;
    }

    .bar-fill {
      height: 100%;
      border-radius: 4px;
      background: var(--accent);
      transition: width 0.6s ease;
    }

    .txn-count {
      font-size: 13px;
      color: var(--muted);
    }

    .amount-cell {
      font-size: 16px;
      font-weight: 800;
      color: var(--accent-lt);
      text-align: right;
    }

    /* ── EXPANDED TRANSACTIONS ── */
    .txn-panel {
      display: none;
      background: var(--surface3);
      border-top: 1px solid var(--border);
    }

    .txn-panel.open { display: block; }

    .txn-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px;
    }

    .txn-table th {
      padding: 8px 16px;
      text-align: left;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: var(--muted);
      border-bottom: 1px solid var(--border);
    }

    .txn-table td {
      padding: 8px 16px;
      border-bottom: 1px solid #2a2924;
      color: var(--text);
    }

    .txn-table tr:last-child td { border-bottom: none; }

    .txn-table td.amount {
      font-weight: 700;
      color: var(--accent-lt);
      text-align: right;
    }

    .platform-badge {
      display: inline-block;
      padding: 2px 7px;
      border-radius: 4px;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    .platform-fanbasis { background: #2a3d4a; color: #7dc7e8; }
    .platform-whop     { background: #3a2d4a; color: #b07de8; }
    .platform-paypal   { background: #2a3a2a; color: #7de87d; }

    .chevron {
      display: inline-block;
      transition: transform 0.2s;
      color: var(--muted);
      font-size: 12px;
      margin-left: 6px;
    }

    .lb-row.expanded .chevron { transform: rotate(180deg); }

    /* ── TOTAL ROW ── */
    .total-row {
      display: grid;
      grid-template-columns: 48px 1fr 120px 100px 140px;
      gap: 0;
      padding: 16px 20px;
      background: var(--surface2);
      border-top: 2px solid var(--accent);
    }

    .total-label {
      grid-column: 1 / 4;
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: var(--accent);
    }

    .total-amount {
      font-size: 18px;
      font-weight: 900;
      color: var(--accent-lt);
      text-align: right;
      grid-column: 5;
    }

    .loading {
      text-align: center;
      padding: 60px;
      color: var(--muted);
      font-size: 15px;
    }
  </style>
</head>
<body>

<header>
  <div class="logo">Tranchi<span>AI</span></div>
  <div class="badge">September 2026 · Closer Cash Collected</div>
</header>

<div class="container">
  <div id="loading" class="loading">Loading...</div>
  <div id="content" style="display:none">

    <p class="section-label">Summary</p>
    <div class="summary-row" id="summary-cards"></div>

    <p class="section-label">Cash Collected by Closer</p>
    <div class="chart-wrap">
      <div class="chart-title">September 2026 — Cash Collected per Closer (sorted by volume)</div>
      <canvas id="bar-chart" height="80"></canvas>
    </div>

    <p class="section-label">Leaderboard — click a closer to see transactions</p>
    <div class="leaderboard">
      <div class="lb-header">
        <div>#</div>
        <div>Closer</div>
        <div></div>
        <div>Deals</div>
        <div style="text-align:right">Cash Collected</div>
      </div>
      <div id="lb-body"></div>
      <div class="total-row">
        <div class="total-label">Total September Cash Collected</div>
        <div class="total-amount" id="grand-total"></div>
      </div>
    </div>

  </div>
</div>

<script>
async function load() {
  const res  = await fetch('/september-closers/api/data');
  const data = await res.json();

  // Aggregate by closer
  const map = {};
  for (const t of data.transactions) {
    if (!map[t.closer]) map[t.closer] = { name: t.closer, total: 0, txns: [] };
    map[t.closer].total += t.amount;
    map[t.closer].txns.push(t);
  }

  const closers = Object.values(map).sort((a, b) => b.total - a.total);
  const grandTotal = closers.reduce((s, c) => s + c.total, 0);
  const maxTotal   = closers[0].total;

  // Summary cards
  const cards = document.getElementById('summary-cards');
  cards.innerHTML = `
    <div class="card">
      <div class="card-label">Total Cash Collected</div>
      <div class="card-value">${fmt(grandTotal)}</div>
      <div class="card-sub">September 2026</div>
    </div>
    <div class="card">
      <div class="card-label">Active Closers</div>
      <div class="card-value">${closers.length}</div>
      <div class="card-sub">in September</div>
    </div>
    <div class="card">
      <div class="card-label">Total Deals</div>
      <div class="card-value">${data.transactions.length}</div>
      <div class="card-sub">transactions</div>
    </div>
    <div class="card">
      <div class="card-label">Avg per Closer</div>
      <div class="card-value">${fmt(Math.round(grandTotal / closers.length))}</div>
      <div class="card-sub">cash collected</div>
    </div>
    <div class="card">
      <div class="card-label">Top Closer</div>
      <div class="card-value" style="font-size:20px">${closers[0].name}</div>
      <div class="card-sub">${fmt(closers[0].total)}</div>
    </div>
  `;

  // Bar chart
  const ctx = document.getElementById('bar-chart').getContext('2d');
  new Chart(ctx, {
    type: 'bar',
    data: {
      labels: closers.map(c => c.name),
      datasets: [{
        label: 'Cash Collected',
        data: closers.map(c => c.total),
        backgroundColor: closers.map((c, i) => {
          if (i === 0) return '#ffd700';
          if (i === 1) return '#c0c0c0';
          if (i === 2) return '#cd7f32';
          return '#c49535';
        }),
        borderRadius: 6,
        borderSkipped: false,
      }]
    },
    options: {
      responsive: true,
      plugins: {
        legend: { display: false },
        tooltip: {
          callbacks: {
            label: ctx => ' ' + fmt(ctx.raw)
          }
        }
      },
      scales: {
        x: {
          ticks: { color: '#9a9588', font: { size: 11, weight: '600' } },
          grid: { color: '#38362f' }
        },
        y: {
          ticks: {
            color: '#9a9588',
            callback: v => '$' + (v >= 1000 ? (v/1000).toFixed(0) + 'k' : v)
          },
          grid: { color: '#38362f' }
        }
      }
    }
  });

  // Leaderboard
  const lb = document.getElementById('lb-body');
  lb.innerHTML = '';

  closers.forEach((c, i) => {
    const rank = i + 1;
    const rankClass = rank === 1 ? 'r1' : rank === 2 ? 'r2' : rank === 3 ? 'r3' : '';
    const pct = ((c.total / maxTotal) * 100).toFixed(1);

    const row = document.createElement('div');
    row.className = 'lb-row';
    row.innerHTML = `
      <div class="rank ${rankClass}">${rank}</div>
      <div class="closer-name">${c.name} <span class="chevron">▾</span></div>
      <div class="bar-cell">
        <div class="bar-track"><div class="bar-fill" style="width:${pct}%"></div></div>
      </div>
      <div class="txn-count">${c.txns.length} deal${c.txns.length !== 1 ? 's' : ''}</div>
      <div class="amount-cell">${fmt(c.total)}</div>
    `;

    const panel = document.createElement('div');
    panel.className = 'txn-panel';

    const sorted = [...c.txns].sort((a, b) => new Date(b.date.split('/').reverse().join('-')) - new Date(a.date.split('/').reverse().join('-')));
    panel.innerHTML = `
      <table class="txn-table">
        <thead>
          <tr>
            <th>Date</th>
            <th>Client</th>
            <th>Platform</th>
            <th style="text-align:right">Amount</th>
          </tr>
        </thead>
        <tbody>
          ${sorted.map(t => `
            <tr>
              <td>${t.date}</td>
              <td>${t.client}</td>
              <td><span class="platform-badge platform-${t.platform}">${t.platform}</span></td>
              <td class="amount">${fmt(t.amount)}</td>
            </tr>
          `).join('')}
        </tbody>
      </table>
    `;

    row.addEventListener('click', () => {
      const open = panel.classList.toggle('open');
      row.classList.toggle('expanded', open);
    });

    lb.appendChild(row);
    lb.appendChild(panel);
  });

  document.getElementById('grand-total').textContent = fmt(grandTotal);

  document.getElementById('loading').style.display = 'none';
  document.getElementById('content').style.display = 'block';
}

function fmt(n) {
  return '$' + n.toLocaleString('en-US', { minimumFractionDigits: 0, maximumFractionDigits: 0 });
}

load().catch(e => {
  document.getElementById('loading').textContent = 'Error loading data.';
  console.error(e);
});
</script>
</body>
</html>
